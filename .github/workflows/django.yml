name: Django CI

on:
  push:
    branches: ["dev", "prod"]
  pull_request:
    branches: ["dev", "prod"]

# Cancel an older run of the same branch or PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Fail if model changes are missing a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test base api --verbosity 2
